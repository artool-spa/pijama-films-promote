<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sine Wave Critter</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="critterCanvas"></canvas>

<script>
const canvas = document.getElementById('critterCanvas');
const ctx = canvas.getContext('2d');

// Resize canvas
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse tracking
const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

// Critter Configuration
const numSegments = 25;
const segments = [];
let time = 0;

// Initialize segments at center
for (let i = 0; i < numSegments; i++) {
    segments.push({ x: mouse.x, y: mouse.y });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    time += 0.15; // Speed of the sine wave ripple

    // Head follows mouse with easing
    segments[0].x += (mouse.x - segments[0].x) * 0.15;
    segments[0].y += (mouse.y - segments[0].y) * 0.15;

    // Body segments follow the preceding segment with a sine wave offset
    for (let i = 1; i < numSegments; i++) {
        const prev = segments[i - 1];
        const curr = segments[i];

        // Target position based on previous segment
        const dx = prev.x - curr.x;
        const dy = prev.y - curr.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const targetDist = 18; // Distance between segments

        if (distance > 0) {
            // Standard inverse kinematics / chain binding
            curr.x = prev.x - (dx / distance) * targetDist;
            curr.y = prev.y - (dy / distance) * targetDist;

            // Apply a perpendicular Sine Wave motion ("critter wiggle")
            // The sine amplitude scales down toward the tail for realism
            const angle = Math.atan2(dy, dx);
            const wiggle = Math.sin(time - i * 0.4) * (2.5 * (numSegments - i) / numSegments);
            
            curr.x += Math.cos(angle + Math.PI / 2) * wiggle;
            curr.y += Math.sin(angle + Math.PI / 2) * wiggle;
        }
    }

    // Draw the Critter (from Tail to Head so Head overlaps nicely)
    for (let i = numSegments - 1; i >= 0; i--) {
        // Taper body thickness from head to tail
        const radius = Math.max(4, 24 * (1 - i / numSegments)); 
        
        ctx.beginPath();
        ctx.arc(segments[i].x, segments[i].y, radius, 0, Math.PI * 2);
        
        // Dynamic green-to-cyan color gradient down the spine
        const hue = 110 + (i * 3);
        ctx.fillStyle = `hsl(${hue}, 80%, 50%)`;
        ctx.shadowColor = `hsl(${hue}, 80%, 40%)`;
        ctx.shadowBlur = i === 0 ? 15 : 0; // Glow effect on head
        
        ctx.fill();
        ctx.closePath();
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
