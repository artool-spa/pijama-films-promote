# Reverse proxy for promote.pijamafilms.com.
#
# DNS points the domain at the Coolify host, which runs this container and
# forwards everything upstream. The application itself has not run on Coolify
# for a while: switching backends means changing the upstream here, not the
# DNS record.
#
# Upstream was http://35.203.185.155:80 (the Cloud Run deployment in the
# pijama-films project) and is now the Firebase App Hosting backend.

server {
    listen 3000;

    location / {
        proxy_pass https://pijama-promote--pijama-promote-firebase.us-central1.hosted.app;

        # The upstream is HTTPS, which brings three requirements the previous
        # plain-HTTP upstream did not have:
        #
        # 1. SNI, or the TLS handshake is rejected.
        # 2. Certificate verification — without it the encrypted connection is
        #    unauthenticated and a hijacked route would go unnoticed.
        # 3. A Host header naming the backend. App Hosting routes by Host, and
        #    promote.pijamafilms.com is not registered there, so forwarding the
        #    browser's Host would land on nothing.
        proxy_ssl_server_name on;
        proxy_ssl_name pijama-promote--pijama-promote-firebase.us-central1.hosted.app;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_set_header Host pijama-promote--pijama-promote-firebase.us-central1.hosted.app;

        # The original host still reaches the app, so redirects and logs can
        # reflect the domain the user actually typed.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /health {
        access_log off;
        return 200 "ok";
    }
}
