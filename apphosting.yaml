# Firebase App Hosting configuration
#
# Project: pijama-promote-firebase (603164121416)
# Backend: pijama-promote (us-central1)
# Runtime SA: firebase-app-hosting-compute@pijama-promote-firebase.iam.gserviceaccount.com
#
# `secret:` entries reference Secret Manager by name; values never live here.
# `value:` entries are plain configuration and are safe to commit.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ---------------------------------------------------------------------------
  # Firebase (Auth + Firestore realtime events)
  #
  # FIREBASE_PROJECT_ID and NEXT_PUBLIC_FIREBASE_PROJECT_ID MUST match: the
  # server publishes events to the first and the browser reads them from the
  # second (see src/lib/events/firestore.ts and src/lib/firebase/client.ts).
  # ---------------------------------------------------------------------------
  - variable: FIREBASE_PROJECT_ID
    value: pijama-promote-firebase
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: pijama-promote-firebase
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: pijama-promote-firebase.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # From the web app 1:603164121416:web:29d55d371d8e562159fb7d
  # (firebase apps:sdkconfig WEB ...). Public by design: it ships to the
  # browser on every page load.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCKzqtQMfoGU0O2nqf5_9rAEtlrk9qOAPQ
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Stripe
  # ---------------------------------------------------------------------------
  # All three belong to account acct_1UDAXTBO3YGG9xBo ("Pijama Promote"), this
  # project's own Stripe account. Until 2026-09-16 they did not match: the
  # publishable key here was a TEST key of a DIFFERENT account (51SyJh2…) while
  # the secret key was live. It went unnoticed because nothing reads the
  # publishable key — checkout runs entirely server-side — so the mismatch had
  # no symptom. Keep the account fragment (51UDAXTBO3YGG9x) identical across the
  # three, and check it whenever any of them is rotated.
  #
  # Public by design: it ships to the browser on every page load.
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: pk_live_51UDAXTBO3YGG9xBoxXpEfsahpeJ3yQcLHT2PwyDcXvTvj4PPM8hbvgTc8xWQ7AyTitdQJxvtuETxhr0U8Dh161yy00efLApdip
    availability:
      - BUILD
      - RUNTIME

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  # Signing secret of endpoint we_1UGT1ABO3YGG9xBoh, created 2026-09-16 for
  # https://promote.pijamafilms.com/api/webhooks/stripe (checkout.session.completed).
  #
  # Stripe signing secrets are PER ENDPOINT, not per account. The previous value
  # was copied from the pijama-films project, so it could never have verified an
  # event sent to this backend — and the account had no endpoint at all, which is
  # why 90 days of logs show zero deliveries from Stripe. Creating a new endpoint
  # here means rolling this value too.
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Google Cloud Storage
  #
  # Bucket in this project, uniform bucket-level access, allUsers granted
  # objectViewer: the creatives have to be fetchable by Meta and Google.
  # The runtime service account holds objectAdmin on it.
  #
  # There is deliberately no GCS_SERVICE_ACCOUNT_KEY_JSON: storage and Vertex
  # AI both authenticate with Application Default Credentials, so no static
  # key is injected into the runtime.
  # ---------------------------------------------------------------------------
  - variable: GCS_BUCKET_NAME
    value: pijama-promote-assets
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Session / cron — generated fresh for this environment, not reused from prod
  # ---------------------------------------------------------------------------
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME

  # Legacy shared secret for the cron endpoints. Kept only until the functions
  # in functions/ are deployed and the logs confirm they authenticate with
  # OIDC; then drop it here and destroy the Secret Manager version. Removing it
  # before that would leave the endpoints unreachable.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Internal triggers (Cloud Scheduler / Cloud Tasks, dispatched from functions/)
  #
  # This backend is public — it serves the site — so the internal routes cannot
  # be closed off with an IAM invoker binding. They verify a Google-signed OIDC
  # token instead: minted for the audience below, carrying one of the service
  # accounts below. Neither value is a secret; both are safe to commit.
  #
  # Set the audience to this backend's own URL. It must match the BACKEND_URL
  # parameter the functions dispatch to, or every token is rejected.
  # ---------------------------------------------------------------------------
  - variable: INTERNAL_TRIGGER_AUDIENCE
    value: https://pijama-promote--pijama-promote-firebase.us-central1.hosted.app
    availability:
      - RUNTIME

  # Comma-separated. The default compute SA is what Cloud Functions v2 runs as
  # unless a dedicated one is assigned.
  - variable: CRON_INVOKER_SERVICE_ACCOUNTS
    value: 603164121416-compute@developer.gserviceaccount.com
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Muvi
  # ---------------------------------------------------------------------------
  - variable: MUVI_BASE_URL
    value: https://apigateway.muvi.com
    availability:
      - RUNTIME

  - variable: MUVI_APP_ID
    secret: MUVI_APP_ID
    availability:
      - RUNTIME

  - variable: MUVI_SECRET_KEY
    secret: MUVI_SECRET_KEY
    availability:
      - RUNTIME

  - variable: MUVI_IP_ADDRESS
    secret: MUVI_IP_ADDRESS
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Meta Ads
  # ---------------------------------------------------------------------------
  - variable: META_API_VERSION
    value: v24.0
    availability:
      - RUNTIME

  - variable: META_BASE_URL
    value: https://graph.facebook.com
    availability:
      - RUNTIME

  - variable: META_ACCESS_TOKEN
    secret: META_ACCESS_TOKEN
    availability:
      - RUNTIME

  - variable: META_AD_ACCOUNT_ID
    secret: META_AD_ACCOUNT_ID
    availability:
      - RUNTIME

  - variable: META_PIXEL_ID
    secret: META_PIXEL_ID
    availability:
      - RUNTIME

  - variable: META_PAGE_ID
    secret: META_PAGE_ID
    availability:
      - RUNTIME

  - variable: META_APP_ID
    secret: META_APP_ID
    availability:
      - RUNTIME

  - variable: META_APP_SECRET
    secret: META_APP_SECRET
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Google Ads (YouTube reuses these credentials — see src/lib/google/youtube.ts)
  # ---------------------------------------------------------------------------
  - variable: GOOGLE_ADS_DEVELOPER_TOKEN
    secret: GOOGLE_ADS_DEVELOPER_TOKEN
    availability:
      - RUNTIME

  - variable: GOOGLE_ADS_CLIENT_ID
    secret: GOOGLE_ADS_CLIENT_ID
    availability:
      - RUNTIME

  - variable: GOOGLE_ADS_CLIENT_SECRET
    secret: GOOGLE_ADS_CLIENT_SECRET
    availability:
      - RUNTIME

  - variable: GOOGLE_ADS_REFRESH_TOKEN
    secret: GOOGLE_ADS_REFRESH_TOKEN
    availability:
      - RUNTIME

  - variable: GOOGLE_ADS_CUSTOMER_ID
    secret: GOOGLE_ADS_CUSTOMER_ID
    availability:
      - RUNTIME

  - variable: GOOGLE_ADS_LOGIN_CUSTOMER_ID
    secret: GOOGLE_ADS_LOGIN_CUSTOMER_ID
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Atlas Console SSO (dashboard.pijamafilms.com, operated by Crazy Cake)
  #
  # Atlas opens https://promote.pijamafilms.com/auth in a new window and posts a
  # JWT over postMessage; /api/auth/atlas/session exchanges it for a session.
  #
  # None of these are secrets: two are URLs and one is a list of partner ids.
  # ---------------------------------------------------------------------------

  # Base URL of the Atlas API. Deliberately configurable: the real base is NOT
  # confirmed. Atlas is a hash-routed SPA, four candidate paths probed on
  # 2026-08-26 all answered 302, and api.pijamafilms.com does not resolve.
  # Keeping it here means re-pointing the integration is a config change.
  # The path /movies/by-partner is appended by src/lib/atlas/config.ts.
  - variable: ATLAS_API_BASE_URL
    value: https://dashboard.pijamafilms.com
    availability:
      - RUNTIME

  # Gate for the `login` mode. Only the exact string "true" enables it; probe
  # mode is unaffected and never mints a session.
  #
  # Enabled 2026-09-01, and the allowlist below is what makes that safe: the two
  # are one decision, not two. Turning this on with an empty or absent allowlist
  # still admits nobody (fail-closed), but widening the allowlist while this is
  # "true" grants real access immediately.
  - variable: ATLAS_LOGIN_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Comma-separated partner ids allowed to log in through Atlas. FAIL-CLOSED:
  # absent or empty rejects everyone, and it must never be read as "empty = all"
  # - getFilms() does not filter by partner, so any session sees the WHOLE
  # catalogue and the platform-wide aggregates. This list is the only thing
  # containing that.
  #
  # These are ATLAS partner ids (Console ObjectIds), NOT the `partnerId` on our
  # own Firebase users. All five current promote users share `pijamafilms`, which
  # Atlas never sends: putting it here would allow nobody while looking
  # configured. Verify a new id by running the /auth panel in probe mode with
  # that person's token and reading the partnerId Atlas returns.
  #
  # 6984824e65c8a085b5d5a632 - jpundurraga@artool.cl, measured 2026-09-01. The
  # in-house operator, deliberately the only entry: with getFilms() unscoped,
  # admitting a real producer here would hand them the whole catalogue.
  #
  # If this ever has to mean "nobody", REMOVE THE ENTRY - do not set `value: ""`.
  # App Hosting rejects an empty value and the whole build fails with
  # "apphosting.yaml is not formatted properly", naming the file and not the
  # line; that is what broke build-2026-09-01-001. Absent is the supported way,
  # `getAtlasAllowedPartnerIds()` reads it as such, and the test "rejects
  # everyone when the allowlist is absent" guards it.
  - variable: ATLAS_LOGIN_ALLOWED_PARTNER_IDS
    value: 6984824e65c8a085b5d5a632
    availability:
      - RUNTIME

  # Origins allowed to postMessage into /auth. Production first; the lab is
  # secondary. No wildcards. NEXT_PUBLIC_* is baked at BUILD time: merging a
  # change to this value does NOT activate it - a rollout is required.
  - variable: NEXT_PUBLIC_ATLAS_ALLOWED_ORIGINS
    value: https://dashboard.pijamafilms.com,https://dashboard-lab.pijamafilms.com
    availability:
      - BUILD
      - RUNTIME
